version: '3.8'
networks:
  ecommerce-network:
    driver: bridge
volumes:
  kafka_data:
  mysql_data:
services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "3306:3306"
    networks:
      - ecommerce-network
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  # Apache Kafka Broker
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:19092,PLAINTEXT_HOST://localhost:9092'

      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:29093'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - ecommerce-network
    volumes:
      - kafka_data:/var/lib/kafka/data
  #Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:19092
    depends_on:
      - kafka
    networks:
      - ecommerce-network
    # --- 1. ELASTICSEARCH CONTAINER ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: always
    environment:
      - node.name=elasticsearch
      - cluster.name=ecommerce-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - ecommerce-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q green || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
 # --- INFRASTRUCTURE SERVICES ---
  config-server:
    build: ./config_server
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./ecommerce_config_repo/config_repo:/app/config-repo
    networks:
      - ecommerce-network
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app/config-repo
    command: >
      --eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
      --eureka.instance.hostname=config-server
      --eureka.instance.prefer-ip-address=false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
        discovery-server:
            condition: service_healthy
  discovery-server:
    build: ./discovery_server
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
  api-gateway:
    build: ./api_gateway
    container_name: api-gateway
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - ecommerce-network

  # --- BUSINESS SERVICES ---
  auth-service:
    build: ./auth_service
    container_name: auth-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:19092
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/auth_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - ecommerce-network

  user-service:
    build: ./user_service
    container_name: user-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/user_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - ecommerce-network
  order-service:
    build: ./order_service
    container_name: order-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/order_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - ecommerce-network
  product-service:
    build: ./product_service
    container_name: product-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/product_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - ecommerce-network
  payment-service:
    build: ./payment_service
    container_name: payment-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - ecommerce-network
  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - ecommerce-network
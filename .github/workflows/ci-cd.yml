name: Simple CI-CD

on:
  push:
    branches: [ "main" ] # Chạy khi bạn push vào nhánh main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Liệt kê chính xác tên các thư mục service của bạn tại đây
        service: [api_gateway, auth_service, cart_service, config_server, discovery_server, notification-service, order_service, product_service, user_service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest

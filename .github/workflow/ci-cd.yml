name: Ecommerce Microservices CI/CD

# Quy trình tự động chạy khi bạn Push code vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Matrix giúp chạy song song nhiều tiến trình build
    strategy:
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - order-service

    steps:
      # Bước 1: Lấy code từ GitHub về máy ảo của GitHub Actions
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 17 (Cần thiết để Maven build file JAR)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Bước 3: Đăng nhập vào Docker Hub (Sử dụng 2 Secret đã tạo)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 4: Thiết lập Docker Buildx (Công cụ giúp build ảnh tối ưu hơn)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 5: Build code Java sang JAR và đóng gói vào Docker Image, sau đó Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          # Gắn 2 tag: một bản là latest, một bản gắn kèm ID commit để dễ quản lý phiên bản
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}